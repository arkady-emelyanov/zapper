# zapper startup config. In a checkout, `zapper` uses this file when run from
# the repository's root; elsewhere `zapper init` copies it to
# ~/.config/zapper/zapper.yaml once and never overwrites it. Relative paths
# here resolve against this file's directory; `~/` is your home. Downloads,
# images, kernels, state and the Claude token stay under your home, outside
# the repository.
#
# The daemon loads this file at start as the running config. API changes
# (`zapper rule add`, `zapper config edit`, approvals remembered in a profile)
# change the running config only: `zapper config diff` shows them,
# `zapper config save` writes them here, `zapper config reload` drops them.
#
# Policy is layered: session → profile → the profiles it extends → global.
# Within a layer the first matching rule wins; `final: true` rules are checked
# first, from global down, and cannot be overridden. Unmatched requests get the
# most specific `defaults`, else deny.

daemon:
  firecracker: ~/.local/share/zapper/bin/firecracker
  images: ~/.local/share/zapper/images
  kernels: ~/.local/share/zapper/kernels
  state: ~/.local/state/zapper
  ui: 127.0.0.1:7878
  ask_timeout_secs: 60
  max_sessions: 16
  # Private networks sessions may reach, when a rule allows the host.
  # Loopback, link-local and this host's addresses stay unreachable.
  private_networks: ["192.168.0.0/24"]

# Secrets. With `mode: proxy` (the default) the session sees the placeholder
# `zapper-secret-<name>`, and the proxy puts the value into requests that a
# rule allows to the secret's `hosts`. With `mode: guest` the value is written
# where a profile uses {{secret:<name>}}, for credentials the client holds
# itself, such as S3 keys and client certificates; issue those scoped and
# short-lived.
secrets:
  # Claude subscription or Claude API: which one pays for Claude Code.
  #
  # `claude` is a token from `claude setup-token`, kept in a 0600 file. It uses
  # your Pro/Max/Team/Enterprise subscription: usage counts against the plan's
  # limits and isn't billed as API usage. Claude Code shows "Claude API" in its
  # banner with this token because the token can only make model requests and
  # can't read your plan; `/status` shows "Auth token: CLAUDE_CODE_OAUTH_TOKEN".
  # The token is for your own use. Other people need their own credentials or
  # an API key.
  # https://code.claude.com/docs/en/authentication#generate-a-long-lived-token
  # https://code.claude.com/docs/en/legal-and-compliance#authentication-and-credential-use
  #
  # `anthropic` (commented out) is a Claude Console API key, billed per token
  # to the Console organization. Claude Code prefers ANTHROPIC_API_KEY over the
  # subscription token, so a profile that sets ANTHROPIC_API_KEY bills the API
  # even when CLAUDE_CODE_OAUTH_TOKEN is set too. Use one or the other.
  # https://code.claude.com/docs/en/authentication#authentication-precedence
  #
  # To check: `/usage` in Claude Code, or claude.ai Settings → Usage for the
  # subscription; platform.claude.com for API usage and spend limits. With
  # extra usage turned off on the plan, requests past the limits are refused
  # rather than charged.
  # anthropic:
  #   env: ANTHROPIC_API_KEY
  #   hosts: [api.anthropic.com]
  # A long-lived Claude token from `claude setup-token`, in a 0600 file.
  claude:
    file: ~/.config/zapper/claude-token
    hosts: [api.anthropic.com]
  # s3:
  #   file: ~/.config/zapper/s3-session.env
  #   mode: guest

policy:
  defaults: { net: deny, exec: allow }
  net:
    - { action: deny, host: "metadata.google.internal", final: true, comment: cloud metadata }
  exec: []

profiles:
  # Everything inherits from here.
  base:
    description: Ubuntu shell; network only as rules allow
    engine:
      image: ubuntu-24.04
      kernel: vmlinux-6.1
      vcpus: 2
      memory_mib: 2048
      disk: 4GiB
      network: nic        # or vsock: no NIC, proxy-aware programs only
    agent:
      kind: generic
      command: [bash, -l]
      user: user
      workdir: /work

  # `zapper run`: a shell on a copy of the current directory.
  default:
    extends: base
    description: Shell on a copy of the current directory
    mounts:
      - { host: "{workdir}", guest: /work, mode: rw }
    policy:
      fs:
        - { path: "/work/**/.env", access: hidden }
        - { path: "/work/.git/config", access: ro }

  # ── The office ────────────────────────────────────────────────────────────
  # Profiles for the example firm below (docs/office.md). Workers run Claude
  # Code headless on your subscription (for API billing instead, uncomment the
  # `anthropic` secret and use ANTHROPIC_API_KEY: "{{secret:anthropic}}" and
  # `secrets: [anthropic]` below; don't set both); the office adds their preamble,
  # skills and the office tools at boot. Images: make image IMAGE=office and
  # make image IMAGE=k3s; the cluster's kernel: make kernel KERNEL=k8s.
  office:
    extends: base
    description: An office worker
    engine: { image: office, vcpus: 2, memory_mib: 4096, disk: 16GiB }
    mounts:
      - { host: "{workdir}", guest: /work, mode: rw, extra: 8GiB }
    agent:
      kind: claude-code
      user: agent
      workdir: /work
      model: claude-opus-5-5
      permission_mode: bypassPermissions
      env:
        CLAUDE_CODE_OAUTH_TOKEN: "{{secret:claude}}"
        # The image's headless browser, for `browse` and Playwright scripts.
        PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
        NODE_PATH: /usr/local/lib/node_modules
    policy:
      net:
        - { action: allow, host: api.anthropic.com, ports: [443], secrets: [claude] }
        - { action: allow, host: apps.acme.internal, ports: [80, 443], comment: the product }
        - { action: allow, host: "*.apps.acme.internal", ports: [80, 443] }
        # The firm's repository and cluster API are for the roles whose
        # profiles allow them (engineers, designers); not even a request.
        - { action: deny, host: git.acme.internal, comment: engineers and designers only }
        - { action: deny, host: cluster.acme.internal, comment: engineers only }
      exec:
        - { action: deny, path: kubectl, comment: the cluster is the engineers' }
      # Everything else goes to the security officers.
      defaults: { net: ask }

  # Engineers also reach the firm's repository and the Kubernetes API.
  office-engineer:
    extends: office
    description: An office engineer
    engine: { memory_mib: 6144, disk: 24GiB }
    policy:
      net:
        - { action: allow, host: git.acme.internal, ports: [443] }
        - { action: allow, host: cluster.acme.internal, ports: [6443] }
      exec:
        - { action: allow, path: kubectl }

  # Designers also push to the firm's repository (design/ and prototypes).
  office-designer:
    extends: office
    description: An office designer
    policy:
      net:
        - { action: allow, host: git.acme.internal, ports: [443] }

  # Security officers reach the internet widely; the global final rules,
  # private networks and the host stay closed. They read the repository.
  office-security:
    extends: office
    description: A security officer
    policy:
      net:
        # First: the broad rule below would otherwise match the API without
        # the token (this layer is checked before the office profile's).
        - { action: allow, host: api.anthropic.com, ports: [443], secrets: [claude] }
        - { action: allow, host: git.acme.internal, ports: [443] }
        - { action: allow, host: "*", ports: [80, 443] }

  # The firm's cluster: k3s on one node, with the k8s kernel.
  office-k3s:
    extends: base
    description: A firm's Kubernetes cluster
    engine: { image: k3s, kernel: vmlinux-6.1-k8s, vcpus: 4, memory_mib: 8192, disk: 30GiB }
    agent: { kind: generic, command: [bash], user: user, workdir: / }
    policy:
      net:
        - { action: allow, host: registry-1.docker.io, ports: [443], comment: image pulls }
        - { action: allow, host: auth.docker.io, ports: [443] }
        - { action: allow, host: production.cloudflare.docker.com, ports: [443] }
        - { action: allow, host: production.cloudfront.docker.com, ports: [443] }
        - { action: allow, host: ghcr.io, ports: [443] }
        - { action: allow, host: pkg-containerd.githubusercontent.com, ports: [443] }
        - { action: allow, host: quay.io, ports: [443] }
        - { action: allow, host: "*.quay.io", ports: [443] }
      defaults: { net: ask }

# Firms: org charts of workers (docs/office.md). `zapper firm up acme` starts
# a fresh run; write to the CEO in the UI or with `zapper mail send acme`.
firms:
  acme:
    description: A small product company
    board: { name: Board }
    budget: { daily_turns: 400, max_concurrent: 3 }
    git: {}
    product_port: 0.0.0.0:8080           # the product, on your LAN too; 127.0.0.1:8080 keeps it on this machine
    dashboard_port: 127.0.0.1:8081       # the cluster's dashboard (Headlamp), for you
    # The workers' prompts, relative to this file: edit a SKILL.md and it
    # applies at the next `zapper firm up`. Skills missing here are built in.
    skills_dir: skills
    facilities:
      cluster: { kind: k3s, profile: office-k3s }
    # What the cluster serves until the firm deploys its product on /.
    landing: { name: "Acme Inc.", motto: "Building digital worlds!" }
    credentials:
      kubeconfig: [engineer]
      git: [engineer, designer]
    roles:
      ceo:
        profile: office
        title: CEO
        skills: { work: ceo }
        avatar: { figure: ceo, color: "#D97757" }
      product-manager:
        profile: office
        title: Product Manager
        skills: { work: product-manager }
        avatar: { figure: product-manager, color: "#C6A15B" }
      manager:
        profile: office
        skills: { work: manager }
        avatar: { figure: manager, color: "#B5715A" }
      engineer:
        profile: office-engineer
        title: Member of Technical Staff
        model: claude-sonnet-5-5
        skills: { work: software-engineer }
        avatar: { figure: engineer, color: "#6A9BCC" }
      designer:
        profile: office-designer
        title: Product Designer
        model: claude-sonnet-5-5
        skills: { work: designer }
        avatar: { figure: designer, color: "#C27BA0" }
      researcher:
        profile: office
        model: claude-sonnet-5-5
        skills: { work: researcher }
        avatar: { figure: researcher, color: "#8E82C2" }
      analyst:
        profile: office
        model: claude-sonnet-5-5
        skills: { work: analyst }
        avatar: { figure: analyst, color: "#BFA35A" }
      security-officer:
        profile: office-security
        title: Security Officer
        skills: { work: security-review }
        avatar: { figure: shield, color: "#788C5D" }
    workers:
      - { name: barbara, role: ceo }
      - { name: margaret, role: product-manager, reports_to: barbara }
      - { name: dennis, role: manager, reports_to: barbara, title: CTO }
      - { name: ada, role: engineer, reports_to: dennis }
      - { name: grace, role: engineer, reports_to: dennis }
      - { name: iris, role: designer, reports_to: margaret }
      - { name: ken, role: analyst, reports_to: margaret }
      - { name: radia, role: security-officer, reports_to: barbara }
    security:
      officers: [radia]
      digest_every: { minutes: 10, requests: 200 }
      answer_within: 15m
