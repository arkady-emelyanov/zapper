[workspace]
resolver = "2"
members = ["crates/zapper-policy", "crates/zapper", "crates/zapper-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
globset = "0.4"
thiserror = "2"

[profile.release]
lto = true
strip = true
